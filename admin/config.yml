backend:
  name: github
  repo: sajeshpjose/GrandMoor
  branch: main

media_folder: content/blog/images
public_folder: /content/blog/images

collections:
  - name: blog
    label: Blog
    folder: content/blog/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Date
        name: date
        widget: datetime
      - label: Author
        name: author
        widget: string
        default: Grandmoor Inc.
      - label: Featured Image
        name: image
        widget: image
      - label: Tags
        name: tags
        widget: list
      - label: Category
        name: category
        widget: select
        options:
          - Thought Leadership
          - How-To
          - Market Insight
          - Operations
      - label: Body
        name: body
        widget: markdown
