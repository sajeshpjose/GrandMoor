# Netlify Configuration for Grandmoor Website

[build]
  publish = "."
  command = ""

# Canonicalize the duplicate-content domain onto the primary domain.
# Requires grandmoor.com to be attached to this Netlify site as a domain alias.
[[redirects]]
  from = "https://grandmoor.com/*"
  to = "https://grandmoor.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.grandmoor.com/*"
  to = "https://grandmoor.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.grandmoor.ca/*"
  to = "https://grandmoor.ca/:splat"
  status = 301
  force = true

# Legacy .html URLs -> current clean URLs
[[redirects]]
  from = "/offerings.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/offerings"
  to = "/services"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/qualify.html"
  to = "/qualify"
  status = 301

# No blanket catch-all here: Netlify automatically serves /404.html
# with a real 404 status for any path that doesn't match a file or
# redirect above, so real pages keep returning 200 and missing pages
# get a proper (not soft) 404.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache headers for static assets.
# css/js are versioned via a "?v=" query string on the <link>/<script> tag
# (bump it whenever the file changes) so a short max-age here is just a
# safety net against a forgotten version bump, not the primary mechanism.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Form submissions
[[headers]]
  for = "/contact/*"
  [headers.values]
    Cache-Control = "public, max-age=0"
