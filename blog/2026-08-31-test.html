<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Testing the content">
    <meta name="robots" content="index, follow">
    <title>Test  | Grandmoor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }
        .blog-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 40px;
        }
        .blog-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: #999;
        }
        .blog-category {
            display: inline-block;
            background: #f0f0f0;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        h1 {
            font-size: 2.5rem;
            margin: 30px 0 20px 0;
            line-height: 1.3;
            color: #1a1a1a;
        }
        h2 {
            font-size: 1.8rem;
            margin: 40px 0 20px 0;
            color: #1a1a1a;
        }
        h3 {
            font-size: 1.4rem;
            margin: 30px 0 15px 0;
            color: #1a1a1a;
        }
        p {
            margin-bottom: 20px;
            line-height: 1.8;
        }
        a {
            color: #667eea;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #667eea;
            font-weight: 600;
        }
        ul, ol {
            margin-left: 20px;
            margin-bottom: 20px;
        }
        li {
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #f5f5f5;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .blog-container {
                padding: 20px;
                margin: 20px auto;
            }
            h1 {
                font-size: 1.8rem;
            }
            h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="blog-container">
        <a href="/blog" class="back-link">← Back to Blog</a>
        
        <div class="blog-meta">
            <span class="blog-category">Thought Leadership</span>
            <span>📅 August 31, 2026</span>
            <span>⏱️ 1 min read</span>
        </div>

        <h1>Test </h1>

        <p>test retry 2
</p>
    </div>
</body>
</html>
